name: Tests

# Corre en todo pull request (a dev y a main). Un PR solo se mergea con todo en verde.
on:
  pull_request:

jobs:
  backend:
    name: pytest (${{ matrix.servicio }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - servicio: auth
            dir: services/auth
            db_url: postgresql+psycopg://auth:auth_test@localhost:5432/auth_db_test
          - servicio: eventos
            dir: services/eventos
            db_url: postgresql+psycopg://eventos:eventos_test@localhost:5432/eventos_db_test
          - servicio: ventas
            dir: services/ventas
            db_url: postgresql+psycopg://ventas:ventas_test@localhost:5432/ventas_db_test
          - servicio: gateway
            dir: gateway
            db_url: postgresql+asyncpg://gateway:gateway_test@localhost:5432/gateway_db_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      TEST_DATABASE_URL: ${{ matrix.db_url }}
      TEST_REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Crear bases de test (mismo script que produccion)
        env:
          PGHOST: localhost
          PGPASSWORD: postgres_test
          POSTGRES_USER: postgres
          DB_SUFFIX: _test
          AUTH_DB_PASSWORD: auth_test
          EVENTOS_DB_PASSWORD: eventos_test
          VENTAS_DB_PASSWORD: ventas_test
          GATEWAY_DB_PASSWORD: gateway_test
        run: bash docker/postgres/01-init-databases.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.dir }}/requirements*.txt

      - name: Instalar dependencias
        working-directory: ${{ matrix.dir }}
        run: pip install -r requirements-dev.txt

      - name: pytest
        working-directory: ${{ matrix.dir }}
        run: python -m pytest -v

  frontend:
    name: vitest (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose.yml con los valores de ejemplo
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.test.yml config --quiet
